spring.datasource.url=jdbc:h2:mem:estoque-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=chave-segura-exclusiva-para-execucao-dos-testes-automatizados
app.jwt.expiration-ms=28800000
app.cors.allowed-origins=http://localhost:5173
app.admin.email=
app.admin.password=
